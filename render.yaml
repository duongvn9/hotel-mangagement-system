# Render Blueprint for the backend API (frontend is deployed on Vercel, see README section 7.2).
# Render dashboard > New > Blueprint > pick this repository.
# Variables with `sync: false` are asked for once in the dashboard and never stored in git.
services:
  - type: web
    name: hms-backend
    runtime: docker
    # Builds the last stage (`prod`) of backend/Dockerfile.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: API_PREFIX
        value: api
      - key: SWAGGER_ENABLED
        value: "false"
      # The container runs as the non-root `node` user; the default ../hms is not writable.
      - key: HMS_ASSET_DIR
        value: /tmp/hms-assets

      # MongoDB Atlas connection string (mongodb+srv://...)
      - key: MONGODB_URI
        sync: false
      # Vercel domain(s), comma separated, for example https://hms.vercel.app
      - key: CORS_ORIGINS
        sync: false

      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false

      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_PAYMENT_URL
        sync: false
      - key: VNPAY_RETURN_URL
        sync: false
      - key: VNPAY_IPN_URL
        sync: false

      # Booking and payment emails (NotificationsModule reads GMAIL_*, not MAIL_*).
      # Set NOTIFICATIONS_ENABLED=true in the dashboard only after both GMAIL_* are set.
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: NOTIFICATIONS_ENABLED
        sync: false
