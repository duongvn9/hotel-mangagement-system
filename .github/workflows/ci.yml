name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Scan application source with blocking CI rules
        run: >-
          semgrep scan
          --config p/ci
          --error
          --strict
          --metrics=off
          backend/src frontend/src

  backend:
    timeout-minutes: 20
    # Keep MongoDB jobs on Ubuntu 22.04 for the kernel compatibility workaround (SERVER-121912).
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongo:8
        ports: ["27017"]
        options: >-
          --label hms.test.run=${{ github.run_id }}
          --label hms.test.attempt=${{ github.run_attempt }}
          --label hms.test.job=backend
          --tmpfs /data/db
          --tmpfs /data/configdb
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MONGODB_URI: mongodb://127.0.0.1:${{ job.services.mongo.ports['27017'] }}/hms_ci_test
      HMS_TEST_URI: mongodb://127.0.0.1:${{ job.services.mongo.ports['27017'] }}/hms_ci_test
      HMS_TEST_HARNESS: github-service
      HMS_TEST_SERVICE_ID: ${{ job.services.mongo.id }}
      HMS_TEST_SERVICE_PORT: ${{ job.services.mongo.ports['27017'] }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  frontend:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  maintenance-smoke:
    # Runtime Compose verification for UC35/36/55/56 and Manager dashboard, isolated from every development database.
    runs-on: ubuntu-22.04
    needs: [semgrep, backend, frontend]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify all five smoke scripts and seed idempotency on owned tmpfs stack
        run: node test/run-disposable-smoke.mjs
      - name: Preserve ownership evidence and command logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporting-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/smoke-artifacts/
          if-no-files-found: warn
