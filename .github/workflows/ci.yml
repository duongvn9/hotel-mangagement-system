name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # MongoDB không khởi động trên kernel Linux 6.19 - 7.0.13 (SERVER-121912);
    # runner ubuntu-latest đang dùng kernel mới nên chạy job cần Mongo trên 22.04.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MONGODB_URI: mongodb://localhost:27017/hms_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build production images
        run: docker compose -f docker-compose.prod.yml build
        env:
          MONGO_ROOT_USERNAME: ci
          MONGO_ROOT_PASSWORD: ci
          CORS_ORIGINS: http://localhost

  maintenance-smoke:
    # Runtime Compose verification for UC35/36, isolated from every development database.
    runs-on: ubuntu-22.04
    needs: [backend, frontend]
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: hms-uc36-ci
      MONGO_DB: hms_uc36_compose_test
      MONGO_PORT: 27038
      BACKEND_PORT: 3038
      FRONTEND_PORT: 5138
      NOTIFICATIONS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5
      - name: Start real development stack
        run: docker compose up --build -d --wait --wait-timeout 120
      - name: Wait for API and frontend proxy
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3038/api/v1/health && curl --fail --silent http://localhost:5138/api/v1/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Seed twice and verify UC36 API, Swagger and idempotency
        run: |
          docker compose exec -T backend npm run seed
          docker compose exec -T backend node test/maintenance-history.smoke.mjs snapshot
          docker compose exec -T backend npm run seed
          docker compose exec -T backend node test/maintenance-history.smoke.mjs verify
      - name: Runtime logs on failure
        if: failure()
        run: docker compose logs --tail 120
      - name: Stop disposable stack
        if: always()
        run: docker compose down --volumes
