server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 10m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Healthcheck của container
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # API: chuyển tới backend trong mạng nội bộ Docker
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Lưu ý: không dùng add_header trong location, nếu không nginx sẽ bỏ các header bảo mật ở trên.

  # File build có hash trong tên: cache lâu
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # SPA: mọi route khác trả về index.html, không cache
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
